[package]
name = "ddcd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ddcd"
path = "src/main.rs"

[dependencies]
ddc-lib            = { workspace = true }
tokio              = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
anyhow             = { workspace = true }
thiserror          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap               = { workspace = true }
futures            = "0.3"

# DDC/CI — enumerates /dev/i2c-* automatically on Linux
ddc-hi  = { version = "0.4.1", features = ["ddc-i2c"] }

# udev hotplug
tokio-udev = "0.10.0"
udev       = "0.9.3"

# config
toml = "0.8"
dirs = "6.0.0"
