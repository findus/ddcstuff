[workspace]
members = ["ddc-lib", "ddcd", "ddcctl"]
resolver = "2"

[workspace.dependencies]
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
thiserror    = "2"
tracing      = "0.1"
clap         = { version = "4", features = ["derive"] }
ddc-lib      = { path = "ddc-lib" }
